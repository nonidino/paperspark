name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  schedule:
    # Refresh the paper snapshot twice a day (07:00 and 19:00 UTC).
    - cron: '0 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Keeps the last good snapshot around, so a category that fails to fetch
      # falls back to its previous papers instead of disappearing.
      - name: Restore previous paper data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: arxiv-data-${{ github.run_id }}
          restore-keys: |
            arxiv-data-

      - name: Fetch papers from arXiv
        run: node scripts/fetch-papers.mjs

      - name: Save paper data
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: arxiv-data-${{ github.run_id }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
